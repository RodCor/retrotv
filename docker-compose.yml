# =============================================================================
#  RetroTV — full Habbo-style retro hotel stack
#  Services:  mysql (MariaDB) · arcturus (Arcturus Morningstar EXTENDED / MS4
#             Java emulator) · nitro (HTML5 client + asset/swf servers) ·
#             cms (Next.js CMS + Admin CRM)
#
#  The emulator runs the official prebuilt MS4 release jar (no Maven build), so
#  first boot is mostly the Nitro client build (~2-3 min). Generate the client
#  assets once with `make assets`.
#
#  Quick start:   cp .env.example .env   &&   docker compose up -d --build
#  Client:        http://127.0.0.1:1080
#  CMS / CRM:     http://127.0.0.1:3010
# =============================================================================
name: retrotv

volumes:
  volume-mysql:
  volume-nitro-converter-node-modules:
  volume-nitro-react-node-modules:
  # Camera plugin photos — written by the emulator, served by the nitro host.
  volume-camera:

networks:
  retrotv:

services:
  mysql:
    container_name: retrotv-mysql
    # 11.4+ is required: the Extended (MS4) dump uses the utf8mb4_uca1400 collations.
    image: mariadb:11.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-arcturus_root_pw}
      - MYSQL_USER=${DB_USER:-arcturus_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-arcturus_pw}
      - MYSQL_DATABASE=${DB_NAME:-habbo}
    volumes:
      - volume-mysql:/var/lib/mysql
      - ./foundation/mysql/conf.d:/etc/mysql/conf.d
      # Extended (MS4) base database + RetroTV extras, loaded on first init.
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-13306}:3306"
    networks:
      - retrotv
    restart: unless-stopped

  arcturus:
    container_name: retrotv-arcturus
    build:
      context: ./emulator
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - volume-camera:/app/usercontent/camera   # Camera plugin output
    ports:
      - "3000:3000" # classic game socket
      - "3001:3001" # rcon
      - "2096:2096" # nitro websocket
    depends_on:
      - mysql
    networks:
      - retrotv
    restart: unless-stopped

  # Asset pipeline: SWF->nitro converter + asset/swf HTTP servers. (The old
  # bundled client on :5154 is unused — the client below replaces it.)
  nitro:
    container_name: retrotv-nitro
    build:
      context: ./foundation/nitro
    entrypoint: ["/bin/sh", "/app/scripts/build.sh"]
    volumes:
      - ./foundation/nitro/:/app/
      - volume-nitro-converter-node-modules:/app/nitro-converter/node_modules
      - volume-nitro-react-node-modules:/app/nitro-react/node_modules
      - volume-camera:/app/nitro-assets/camera   # serve Camera photos at :8080/camera/
    ports:
      - "8080:8080" # assets server (gamedata + bundled .nitro)
      - "8081:8081" # swf server (c_images, furni icons)
    networks:
      - retrotv
    restart: unless-stopped

  # Game client — Nitro-V3, matching the MS4 emulator's packet protocol.
  client:
    container_name: retrotv-client
    build:
      context: ./client
    environment:
      - WS_URL=${WS_URL:-ws://127.0.0.1:2096}
      - API_URL=${API_URL:-http://127.0.0.1:2096}
      - ASSET_URL=${ASSET_URL:-http://127.0.0.1:8080/bundled}
      - GAMEDATA_URL=${GAMEDATA_URL:-http://127.0.0.1:8080/gamedata}
      - IMAGE_LIBRARY_URL=${IMAGE_LIBRARY_URL:-http://127.0.0.1:8081/c_images/}
      - HOF_FURNI_URL=${HOF_FURNI_URL:-http://127.0.0.1:8081/dcr/hof_furni}
      - IMAGES_URL=${IMAGES_URL:-http://127.0.0.1:8080/images}
      - CLIENT_URL=${CLIENT_URL:-http://127.0.0.1:1080}
      - HOTEL_NAME=${HOTEL_NAME:-RetroTV}
      - HOTEL_LANG=${HOTEL_LANG:-es}
    ports:
      - "1080:80"
    depends_on:
      - nitro
      - arcturus
    networks:
      - retrotv
    restart: unless-stopped

  cms:
    container_name: retrotv-cms
    build:
      context: ./cms
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-arcturus_user}
      - DB_PASSWORD=${DB_PASSWORD:-arcturus_pw}
      - DB_NAME=${DB_NAME:-habbo}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-0000000000000000}
      - NEXT_PUBLIC_HOTEL_NAME=${HOTEL_NAME:-RetroTV}
      - NEXT_PUBLIC_CLIENT_URL=${CLIENT_URL:-http://127.0.0.1:1080}
      - NEXT_PUBLIC_IMAGING_URL=${IMAGING_URL:-https://www.habbo.com/habbo-imaging}
      # Furni icon PNGs are loaded by the browser -> must be the public asset host.
      - NEXT_PUBLIC_FURNI_ICON_URL=${FURNI_ICON_URL:-http://127.0.0.1:8081/dcr/hof_furni/icons}
      # FigureData is fetched server-side -> use the internal asset service name.
      - GAMEDATA_URL=${CMS_GAMEDATA_URL:-http://nitro:8080/gamedata}
      - ADMIN_MIN_RANK=${ADMIN_MIN_RANK:-5}
    ports:
      - "3010:3000"
    depends_on:
      - mysql
    networks:
      - retrotv
    restart: unless-stopped
