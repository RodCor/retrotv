# =============================================================================
#  RetroTV — full Habbo-style retro hotel stack
#  Services:  mysql (MariaDB) · arcturus (Java emulator) · nitro (HTML5 client
#             + asset/swf servers) · cms (Next.js CMS + Admin CRM)
#
#  First boot compiles the emulator (Maven) and builds the client — allow
#  ~10 minutes. Subsequent boots reuse cached build volumes and are fast.
#
#  Quick start:   cp .env.example .env   &&   docker compose up -d --build
#  Client:        http://127.0.0.1:1080
#  CMS / CRM:     http://127.0.0.1:3010
# =============================================================================
name: retrotv

volumes:
  volume-mysql:
  volume-arcturus-maven-repo:
  volume-arcturus-target:
  volume-nitro-converter-node-modules:
  volume-nitro-react-node-modules:
  # Camera plugin photos — written by the emulator, served by the nitro host.
  volume-camera:

networks:
  retrotv:

services:
  mysql:
    container_name: retrotv-mysql
    image: mariadb:10.6
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-arcturus_root_pw}
      - MYSQL_USER=${DB_USER:-arcturus_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-arcturus_pw}
      - MYSQL_DATABASE=${DB_NAME:-arcturus}
    volumes:
      - volume-mysql:/var/lib/mysql
      - ./foundation/mysql/conf.d:/etc/mysql/conf.d
      - ./foundation/mysql/dumps:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-13306}:3306"
    networks:
      - retrotv
    restart: unless-stopped

  arcturus:
    container_name: retrotv-arcturus
    build:
      context: ./foundation/emulator
    entrypoint: ["/bin/sh", "/app/scripts/build.sh"]
    volumes:
      - ./foundation/emulator/:/app/
      - volume-arcturus-target:/app/arcturus/target
      - volume-arcturus-maven-repo:/root/.m2
      - volume-camera:/app/usercontent/camera   # Camera plugin output
    ports:
      - "3000:3000" # classic game socket
      - "3001:3001" # rcon
      - "2096:2096" # nitro websocket
    depends_on:
      - mysql
    networks:
      - retrotv
    restart: unless-stopped

  nitro:
    container_name: retrotv-nitro
    build:
      context: ./foundation/nitro
    entrypoint: ["/bin/sh", "/app/scripts/build.sh"]
    volumes:
      - ./foundation/nitro/:/app/
      - volume-nitro-converter-node-modules:/app/nitro-converter/node_modules
      - volume-nitro-react-node-modules:/app/nitro-react/node_modules
      - volume-camera:/app/nitro-assets/camera   # serve Camera photos at :8080/camera/
    ports:
      - "1080:5154" # client web
      - "8080:8080" # assets server
      - "8081:8081" # swf server
    networks:
      - retrotv
    restart: unless-stopped

  cms:
    container_name: retrotv-cms
    build:
      context: ./cms
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-arcturus_user}
      - DB_PASSWORD=${DB_PASSWORD:-arcturus_pw}
      - DB_NAME=${DB_NAME:-arcturus}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production-0000000000000000}
      - NEXT_PUBLIC_HOTEL_NAME=${HOTEL_NAME:-RetroTV}
      - NEXT_PUBLIC_CLIENT_URL=${CLIENT_URL:-http://127.0.0.1:1080}
      - NEXT_PUBLIC_IMAGING_URL=${IMAGING_URL:-https://www.habbo.com/habbo-imaging}
      - ADMIN_MIN_RANK=${ADMIN_MIN_RANK:-5}
    ports:
      - "3010:3000"
    depends_on:
      - mysql
    networks:
      - retrotv
    restart: unless-stopped
