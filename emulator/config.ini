#Database Configuration.
db.hostname=mysql
db.port=3306
db.database=habbo
db.username=arcturus_user
db.password=arcturus_pw
db.params=
db.pool.minsize=10
db.pool.maxsize=50

# WebSocket / packet encryption — disabled for the standard Nitro client flow.
crypto.ws.enabled=0
crypto.ws.signing.enabled=false
crypto.ws.signing.public_key=
crypto.ws.signing.private_key=

#Game Configuration.
game.host=0.0.0.0
game.port=3000

#RCON Configuration.
rcon.host=0.0.0.0
rcon.port=3001
rcon.allowed=127.0.0.1;127.0.0.2;172.16.0.0;10.0.0.0;192.168.0.0

# Database pool tuning
db.pool.connection_timeout_ms = 10000
db.pool.idle_timeout_ms       = 600000
db.pool.max_lifetime_ms       = 1800000
db.pool.validation_timeout_ms = 5000
db.pool.leak_detection_ms     = 0

# Legacy RSA encryption — off (Nitro uses unencrypted SSO).
enc.enabled=false

# Nitro "secure runtime" — disabled so the standard Nitro client (plain
# renderer-config.json + SSO) connects without the signed-config handshake.
nitro.secure.assets.enabled=false
nitro.secure.api.enabled=false

# Remember-me login tokens (used by the emulator's own auth API; harmless here).
login.remember.enabled=true
login.remember.duration.days=30
login.news.limit=5

# WebSocket (for the Nitro client). GameServer.initializeWebSocketServer()
# reads these keys; ws.enabled defaults to false so it MUST be set true.
ws.enabled=true
ws.host=0.0.0.0
ws.port=2096
ws.whitelist=*
